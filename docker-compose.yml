services:
  postgres:
    image: postgres:17
    container_name: nido-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nido-migrator:
    image: ${NIDO_MIGRATOR_IMAGE:-nido-migrator:local}
    build:
      context: .
      target: migrator
    container_name: nido-migrator
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    depends_on:
      postgres:
        condition: service_healthy

  nido-api:
    image: ${NIDO_API_IMAGE:-nido-api:local}
    build:
      context: .
      target: runtime
    container_name: nido-api
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - RESEND_API_KEY=${RESEND_API_KEY}
      - Email__FromAddress=${Email__FromAddress}
      - Email__FromName=${Email__FromName}
      - Frontend__BaseUrl=${Frontend__BaseUrl}
      - Jwt__Key=${Jwt__Key}
      - Google__ClientId=${Google__ClientId}
      - Vapid__PublicKey=${Vapid__PublicKey}
      - Vapid__PrivateKey=${Vapid__PrivateKey}
      - Vapid__Subject=${Vapid__Subject}
      - Spaces__Enabled=${Spaces__Enabled}
      - Spaces__Bucket=${Spaces__Bucket}
      - Spaces__PublicBaseUrl=${Spaces__PublicBaseUrl}
      - Spaces__Endpoint=${Spaces__Endpoint}
      - Spaces__Region=${Spaces__Region}
      - Spaces__AccessKey=${Spaces__AccessKey}
      - Spaces__SecretKey=${Spaces__SecretKey}
      - Telegram__BotToken=${Telegram__BotToken}
      - Telegram__WebhookSecretToken=${Telegram__WebhookSecretToken}
      - Telegram__BotUsername=${Telegram__BotUsername}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./src/Nido.Api/wwwroot/uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      nido-migrator:
        condition: service_completed_successfully

  nido-caddy:
    profiles:
      - production
    image: ${NIDO_CADDY_IMAGE:-nido-caddy:local}
    build:
      context: ./caddy
    container_name: nido-caddy
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nido-api
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config: