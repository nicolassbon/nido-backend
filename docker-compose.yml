services:
  postgres:
    image: postgres:17
    container_name: nido-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nido-migrator:
    image: ${NIDO_MIGRATOR_IMAGE:-nido-migrator:local}
    build:
      context: .
      target: migrator
    container_name: nido-migrator
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    depends_on:
      postgres:
        condition: service_healthy

  nido-api:
    image: ${NIDO_API_IMAGE:-nido-api:local}
    build:
      context: .
      target: runtime
    container_name: nido-api
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - RESEND_API_KEY=${RESEND_API_KEY}
      - Email__FromAddress=${Email__FromAddress}
      - Email__FromName=${Email__FromName}
      - Frontend__BaseUrl=${Frontend__BaseUrl:?Frontend__BaseUrl is required}
      - Jwt__Key=${Jwt__Key}
      - Google__ClientId=${Google__ClientId}
      - Vapid__PublicKey=${Vapid__PublicKey:-}
      - Vapid__PrivateKey=${Vapid__PrivateKey:-}
      - Vapid__Subject=${Vapid__Subject:-}
      - Spaces__Enabled=${Spaces__Enabled}
      - Spaces__Bucket=${Spaces__Bucket}
      - Spaces__PublicBaseUrl=${Spaces__PublicBaseUrl}
      - Spaces__Endpoint=${Spaces__Endpoint}
      - Spaces__Region=${Spaces__Region}
      - Spaces__AccessKey=${Spaces__AccessKey}
      - Spaces__SecretKey=${Spaces__SecretKey}
      - GoogleDocumentAi__ProjectId=${GoogleDocumentAi__ProjectId}
      - GoogleDocumentAi__Location=${GoogleDocumentAi__Location}
      - GoogleDocumentAi__ProcessorId=${GoogleDocumentAi__ProcessorId}
      - GoogleDocumentAi__ReceiptProcessorId=${GoogleDocumentAi__ReceiptProcessorId}
      - GoogleDocumentAi__NutritionProcessorId=${GoogleDocumentAi__NutritionProcessorId}
      - Ia__BaseUrl=${Ia__BaseUrl:-http://host.docker.internal:5000}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/nido-document-ai.json}
      - Telegram__BotToken=${Telegram__BotToken}
      - Telegram__WebhookSecretToken=${Telegram__WebhookSecretToken}
      - Telegram__BotUsername=${Telegram__BotUsername}
      - Telegram__WebhookUrl=${Telegram__WebhookUrl:-}
      - ExternalServices__ComparatorUrl=http://nido-comparator:3000/
      - MercadoPago__AccessToken=${MercadoPago__AccessToken:?MercadoPago__AccessToken is required}
      - MercadoPago__PublicKey=${MercadoPago__PublicKey:-}
      - MercadoPago__WebhookSecret=${MercadoPago__WebhookSecret:?MercadoPago__WebhookSecret is required}
      - MercadoPago__Mode=${MercadoPago__Mode:?MercadoPago__Mode is required (use Sandbox or Production)}
      - MercadoPago__UnitPrice=${MercadoPago__UnitPrice:?MercadoPago__UnitPrice is required}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./src/Nido.Api/wwwroot/uploads:/app/wwwroot/uploads

      - type: bind
        source: ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH:-./secrets/nido-document-ai.json}
        target: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/nido-document-ai.json}
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      nido-migrator:
        condition: service_completed_successfully
      nido-comparator:
        condition: service_healthy

  nido-caddy:
    profiles:
      - production
    image: ${NIDO_CADDY_IMAGE:-nido-caddy:local}
    build:
      context: ./caddy
    container_name: nido-caddy
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nido-api
    restart: unless-stopped

  nido-redis:
    image: redis:7-alpine
    container_name: nido-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  nido-comparator:
    image: ${NIDO_COMPARATOR_IMAGE:-javier073/nido-comparator:latest}
    container_name: nido-comparator
    environment:
      - PORT=3000
      - ENV=${COMPARATOR_ENV:-development}
      - REDIS_URL=redis://nido-redis:6379
      - REDIS_CACHE_EXPIRATION=28800
      - RESPONSE_CACHE_EXPIRATION=3600
      - CORE_CACHE_EXPIRATION=0
      - VTEX_SHA256_HASH=${VTEX_SHA256_HASH:?VTEX_SHA256_HASH is required}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      nido-redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
