services:
  postgres:
    image: postgres:17
    container_name: nido-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nido-migrator:
    build:
      context: .
      target: migrator
    container_name: nido-migrator
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    depends_on:
      postgres:
        condition: service_healthy

  nido-api:
    build:
      context: .
      target: runtime
    container_name: nido-api
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Development
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - RESEND_API_KEY=${RESEND_API_KEY}
      - Email__FromAddress=${Email__FromAddress}
      - Email__FromName=${Email__FromName}
      - Frontend__BaseUrl=${Frontend__BaseUrl}
      - Jwt__Key=${Jwt__Key}
      - Google__ClientId=${Google__ClientId}
      - ProfileImages__PublicBaseUrl=${ProfileImages__PublicBaseUrl}
    ports:
      - "8080:8080"
    volumes:
      - ./src/Nido.Api/wwwroot/uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      nido-migrator:
        condition: service_completed_successfully

volumes:
  postgres-data:
