name: Backend CI/CD

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Nido.slnx

      - name: Build
        run: dotnet build Nido.slnx --no-restore

      - name: Test
        run: dotnet test Nido.slnx --no-build --verbosity normal

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nido-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nido-api:${{ github.sha }}

      - name: Build and push migrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: migrator
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nido-migrator:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nido-migrator:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /app/nido
            umask 077
            printf '%s' '${{ secrets.ENV_FILE_B64 }}' | base64 -d > .env
            chmod 600 .env
            export NIDO_API_IMAGE='${{ secrets.DOCKERHUB_USERNAME }}/nido-api:latest'
            export NIDO_MIGRATOR_IMAGE='${{ secrets.DOCKERHUB_USERNAME }}/nido-migrator:latest'
            export ASPNETCORE_ENVIRONMENT=Production
            docker compose pull nido-api nido-migrator
            docker compose run --rm nido-migrator
            docker compose up -d --remove-orphans nido-api

            attempts=10
            for attempt in $(seq 1 "$attempts"); do
              if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://localhost:8080/health; then
                echo
                echo "nido-api is healthy"
                break
              fi

              echo "Health check attempt $attempt/$attempts failed"
              docker compose logs --tail=50 nido-api || true

              if [ "$attempt" -eq "$attempts" ]; then
                echo "nido-api failed health verification"
                exit 1
              fi

              sleep 5
            done

            docker image prune -f
            docker ps
